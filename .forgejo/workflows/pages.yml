name: RTH Watch - update data and publish Pages

on:
  push:
    branches: [main]
    paths:
      - '.forgejo/workflows/pages.yml'
      - '.forgejo/workflows/aircraft.yml'
      - '.forgejo/workflows/stations.yml'
      - '.forgejo/workflows/reconcile.yml'
      - '.forgejo/workflows/publish-reusable.yml'
      - 'config/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Import or publication mode'
        required: true
        default: full
        type: choice
        options:
          - full
          - stations
          - aircraft
          - publish
          - reconcile

concurrency:
  group: rth-watch-pages
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.forgejo/workflows/publish-reusable.yml
    with:
      mode: ${{ forgejo.event_name == 'push' && 'publish' || inputs.mode }}
    secrets: inherit
