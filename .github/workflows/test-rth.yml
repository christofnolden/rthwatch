name: Test RTH-Info Connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test RTH-Info and ICAO database
        shell: bash
        run: |
          set -euo pipefail

          test_url() {
            local name="$1"
            local url="$2"

            echo ""
            echo "================================="
            echo "Testing: $name"
            echo "================================="

            curl \
              --location \
              --silent \
              --show-error \
              --fail \
              --retry 1 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 15 \
              --max-time 45 \
              --output /tmp/rotorwatch-test.html \
              --write-out \
              'HTTP: %{http_code}\nTime: %{time_total}s\nSize: %{size_download} bytes\n' \
              "$url"

            test -s /tmp/rotorwatch-test.html

            echo "SUCCESS: $name"
          }

          test_url \
            "RTH-Info Stations" \
            "https://www.rth.info/stationen.db/stationen.php"

          test_url \
            "Christoph 1" \
            "https://www.rth.info/stationen.db/station.php?id=1&show=1"

          test_url \
            "Christoph 2" \
            "https://www.rth.info/stationen.db/station.php?id=2&show=1"

          test_url \
            "ICAO Database" \
            "https://raw.githubusercontent.com/wiedehopf/tar1090-db/master/db/regIcao.js"

          echo ""
          echo "ALL TESTS SUCCESSFUL"
